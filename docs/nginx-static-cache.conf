# Include this inside the ADV frontend nginx server block.
# Adjust `root` in the server block to the built `dist` directory.

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
  application/javascript
  application/json
  application/rss+xml
  application/xml
  image/svg+xml
  text/css
  text/javascript
  text/plain
  text/xml;

# Enable only when the nginx brotli module is installed.
# brotli on;
# brotli_comp_level 5;
# brotli_types application/javascript application/json image/svg+xml text/css text/plain;

location ~* ^/assets/index-.*\.(?:js|css)$ {
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  try_files $uri =404;
}

location ~* ^/assets/fonts/ {
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  try_files $uri =404;
}

location ~* ^/assets/.*\.(?:webp|jpg|jpeg|png|mp4)$ {
  add_header Cache-Control "public, max-age=2592000" always;
  try_files $uri =404;
}

location ^~ /content/ {
  add_header Cache-Control "public, max-age=300, must-revalidate" always;
  try_files $uri =404;
}

location = /robots.txt {
  add_header Cache-Control "public, max-age=3600" always;
  try_files $uri =404;
}

location = /sitemap.xml {
  add_header Cache-Control "public, max-age=3600" always;
  try_files $uri =404;
}

location / {
  add_header Cache-Control "no-cache" always;
  try_files $uri $uri/ /index.html;
}
