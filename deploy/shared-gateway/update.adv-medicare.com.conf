server {
    listen 80;
    server_name update.adv-medicare.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://update.adv-medicare.com$request_uri;
    }
}

# Install the HTTPS block after Certbot creates the update.adv-medicare.com lineage.
server {
    listen 443 ssl;
    server_name update.adv-medicare.com;

    ssl_certificate     /etc/letsencrypt/live/update.adv-medicare.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/update.adv-medicare.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        return 404;
    }
}
