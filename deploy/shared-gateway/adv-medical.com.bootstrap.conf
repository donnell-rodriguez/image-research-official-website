server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/adv-medicare.com/adv-medicare.com.crt;
    ssl_certificate_key /etc/caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/adv-medicare.com/adv-medicare.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        return 444;
    }
}

server {
    listen 80;
    server_name adv-medicare.com www.adv-medicare.com system.adv-medicare.com api.adv-medicare.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name adv-medicare.com;

    ssl_certificate     /etc/caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/adv-medicare.com/adv-medicare.com.crt;
    ssl_certificate_key /etc/caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/adv-medicare.com/adv-medicare.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $system_upstream http://adv-medical-system-frontend:80;

    client_max_body_size 0;

    location = /health {
        proxy_pass $system_upstream$request_uri;
        include /etc/nginx/proxy_params;
    }

    location ^~ /api/ {
        proxy_pass $system_upstream$request_uri;
        include /etc/nginx/proxy_params;
    }

    location / {
        return 308 https://www.adv-medicare.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.adv-medicare.com;

    ssl_certificate     /etc/caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/www.adv-medicare.com/www.adv-medicare.com.crt;
    ssl_certificate_key /etc/caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/www.adv-medicare.com/www.adv-medicare.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $official_upstream http://adv-medical-official-website:80;
    set $system_upstream http://adv-medical-system-frontend:80;

    client_max_body_size 0;

    location ~ ^/(2d-dicom|3d-dicom|account-center|admin-dashboard|ai-fifo|classification|ct|feature-importance|gene-feature|gene|immune-adaptiveness|immunotherapy-adaptiveness|immunotherapy-response|index|login|mdt-report|model-feature|network-config|patient-management|register|segmentation|similar-cases|tanstack)\.html$ {
        return 308 https://system.adv-medicare.com$request_uri;
    }

    location = /health {
        proxy_pass $system_upstream$request_uri;
        include /etc/nginx/proxy_params;
    }

    location ^~ /api/ {
        proxy_pass $system_upstream$request_uri;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass $official_upstream$request_uri;
        include /etc/nginx/proxy_params;
    }
}

server {
    listen 443 ssl;
    server_name system.adv-medicare.com;

    ssl_certificate     /etc/caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/system.adv-medicare.com/system.adv-medicare.com.crt;
    ssl_certificate_key /etc/caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/system.adv-medicare.com/system.adv-medicare.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $system_upstream http://adv-medical-system-frontend:80;

    client_max_body_size 0;

    location / {
        proxy_pass $system_upstream$request_uri;
        include /etc/nginx/proxy_params;
    }
}

server {
    listen 443 ssl;
    server_name api.adv-medicare.com;

    ssl_certificate     /etc/caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/api.adv-medicare.com/api.adv-medicare.com.crt;
    ssl_certificate_key /etc/caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/api.adv-medicare.com/api.adv-medicare.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://adv-medical-api:9000;

    client_max_body_size 0;

    location ~ ^/(health$|v2(?:/|$)|v1/api(?:/|$)) {
        proxy_pass $api_upstream$request_uri;
        include /etc/nginx/proxy_params;
    }

    location / {
        return 404;
    }
}
